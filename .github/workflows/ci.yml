name: CI

on:
  pull_request:
    branches:
      - development
      - staging
      - main
  push:
    branches:
      - development
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paperbot
          POSTGRES_DB: paperbot
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U paperbot -d paperbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint GitHub Actions workflow
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dashboard dependencies
        run: |
          corepack enable
          pnpm --dir dashboard install --frozen-lockfile

      - name: Run Go unit tests
        run: go test ./...

      - name: Run Go race tests
        run: go test -race ./...

      - name: Run Go static checks
        run: |
          go vet ./...
          go build ./cmd/paper-bot

      - name: Run dashboard verification
        run: pnpm --dir dashboard run verify

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes postgresql-client

      - name: Apply project migrations to the ephemeral database
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGUSER: paperbot
          PGDATABASE: paperbot
        run: |
          for migration in supabase/migrations/*.sql; do
            psql --no-psqlrc --set=ON_ERROR_STOP=1 --file "$migration"
          done

      - name: Run PostgreSQL repository and integration contracts
        env:
          TEST_DATABASE_URL: postgres://paperbot@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/paperbot?sslmode=disable
        run: go test -p 1 ./internal/adapters/postgres ./tests/integration

      - name: Run paper-only and topology guards
        run: |
          bash scripts/verify-no-live-trading-deps.sh
          bash tests/verify-no-live-trading-deps_test.sh
          bash tests/verify-compose-topology.sh
          bash tests/verify-compose-topology_test.sh
          bash tests/verify-dashboard-proxy.sh
          bash tests/verify-github-actions.sh
          bash tests/verify-github-actions_test.sh

      - name: Verify whitespace
        run: git diff --check

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
